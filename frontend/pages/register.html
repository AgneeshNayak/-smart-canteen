<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register – Smart Canteen</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-bg"></div>
  <div class="auth-card" style="max-width:500px;">
    <div class="auth-header">
      <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:16px;">
        <div class="logo-icon">🍽️</div>
        <span style="font-family:Syne,sans-serif;font-size:20px;font-weight:800;">Smart<span style="color:var(--accent);">Canteen</span></span>
      </div>
      <h1 class="auth-title">Create account</h1>
      <p class="auth-sub">Join the smart canteen system today</p>
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input id="name" type="text" class="form-input" placeholder="Rahul Sharma">
      </div>
      <div class="form-group">
        <label class="form-label">Student ID</label>
        <input id="studentId" type="text" class="form-input" placeholder="STU2024001">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Email Address</label>
      <input id="email" type="email" class="form-input" placeholder="rahul@college.edu">
    </div>
    <div class="form-group">
      <label class="form-label">Phone Number</label>
      <input id="phone" type="tel" class="form-input" placeholder="9876543210">
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input id="password" type="password" class="form-input" placeholder="Min. 6 characters">
    </div>

    <button class="btn btn-primary btn-full" onclick="handleRegister()">
      <span id="regText">Create Account</span>
    </button>

    <hr class="divider">
    <p style="text-align:center;font-size:14px;color:var(--text2);">
      Already have an account? <a href="login.html" style="color:var(--accent);font-weight:600;">Sign In</a>
    </p>
  </div>
</div>

<script src="../js/app.js"></script>
<script>
const u = getUser();
if (u) window.location.href = u.role === 'admin' ? 'admin.html' : 'dashboard.html';

async function handleRegister() {
  const name = document.getElementById('name').value.trim();
  const studentId = document.getElementById('studentId').value.trim();
  const email = document.getElementById('email').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.querySelector('.btn-primary');
  const txt = document.getElementById('regText');

  if (!name || !studentId || !email || !phone || !password)
    return toast('All fields are required', 'error');
  if (password.length < 6)
    return toast('Password must be at least 6 characters', 'error');

  btn.disabled = true;
  txt.textContent = 'Creating account…';
  try {
    const data = await apiFetch('/auth/register', {
      method: 'POST',
      body: JSON.stringify({ name, studentId, email, phone, password })
    });
    setAuth(data.token, data.user);
    toast('Account created successfully!', 'success');
    setTimeout(() => window.location.href = 'dashboard.html', 800);
  } catch (err) {
    toast(err.message, 'error');
    btn.disabled = false;
    txt.textContent = 'Create Account';
  }
}
</script>
</body>
</html>
